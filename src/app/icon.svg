<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Toothlogy">
  <title>Toothlogy</title>
  <!--
    Favicon artwork.

    Deliberately simpler than public/brand/toothlogy-mark.svg. The mark's dial
    ticks, Rx and sparkle are 2-6px features at the size this is actually used
    at, where they do not read as detail — they read as dirt around the tooth.
    The mark's inset rim goes too: at 16px it costs a pixel of tooth for a line
    nobody can resolve. Dropping all of it and growing the tooth is what makes
    the icon identifiable in a tab strip, which is the only job this file has.
  -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a094"/>
      <stop offset="0.45" stop-color="#1c85a0"/>
      <stop offset="1" stop-color="#2a6698"/>
    </linearGradient>
    <linearGradient id="e" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6fafc"/>
      <stop offset="1" stop-color="#dbe8f0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#t)"/>
  <!-- The tooth fills ~62% of the tile height, against ~50% in the full mark. -->
  <path fill="url(#e)" d="M256 96c-50 0-88 26-93 76-4 33 6 64 14 95 11 41 18 81 22 110 2 17 9 26 19 26 11 0 17-11 19-29 5-43 11-71 19-71s14 28 19 71c2 18 8 29 19 29 10 0 17-9 19-26 4-29 11-69 22-110 8-31 18-62 14-95-5-50-43-76-93-76z"/>
  <path fill="#ffffff" fill-opacity="0.9" d="M205 137c15-13 34-19 47-16 9 2 7 11-3 15-18 7-32 19-40 33-7 11-17 8-17-4 0-9 5-19 13-28z"/>
</svg>
